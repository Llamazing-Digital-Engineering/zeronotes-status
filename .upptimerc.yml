# Upptime configuration for status.zeronotes.is (architecture 9.1).
# Lives in its own repository Llamazing-Digital-Engineering/zeronotes-status, created from the template
# https://github.com/upptime/upptime ; see README.md in this directory.
owner: Llamazing-Digital-Engineering
repo: zeronotes-status

sites:
  # Interim until the first deployment of ZeroNotes 2: only the running app (ZeroNotes 1) is checked, so that
  # the status page does not report outages for things that are not live yet. At the first deployment this list
  # becomes the one in llamazing-digital-engineering/zeronotes, deploy/upptime/.upptimerc.yml
  # (app.zeronotes.is/api/health and zeronotes.is).
  - name: App
    url: https://app.zeronotes.is
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

# Every 5 minutes; failures open an issue assigned to Björn (GitHub notifies by mail).
assignees:
  - BjarneBerlin
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 */6 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * 0"
  updates: "0 3 * * *"

status-website:
  cname: status.zeronotes.is
  name: ZeroNotes Status
  introTitle: "ZeroNotes status"
  introMessage: "Availability of app.zeronotes.is and zeronotes.is, checked every five minutes from GitHub Actions."
  navbar:
    - title: ZeroNotes
      href: https://zeronotes.is
    - title: Source
      href: https://github.com/llamazing-digital-engineering/zeronotes
  theme: light

i18n:
  up: Operational
  down: Down
  degraded: Degraded
